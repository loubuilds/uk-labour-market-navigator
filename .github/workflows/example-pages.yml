name: Publish static example

# Deliberately manual: pushing the repository does not deploy this example.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: example-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reverify and prepare only the fictional report
        run: python -m scripts.prepare_example_site --output dist/example-site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/example-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static example
        id: deployment
        uses: actions/deploy-pages@v4
